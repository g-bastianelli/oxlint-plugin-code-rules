name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: node --test test/*.test.js
      - run: node_modules/.bin/oxlint src test bench
      - run: node_modules/.bin/oxfmt --check src test bench README.md CHANGELOG.md AGENTS.md package.json
      - name: Check whether the version is already published
        id: published
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      # Uses npm trusted publishing (OIDC) when configured on npmjs.com,
      # otherwise falls back to the NPM_TOKEN repository secret.
      - if: steps.published.outputs.exists != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
